
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus favoritos | GameVerse</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .pagina-favoritos {
            width: min(1200px, 92%);
            margin: 40px auto;
            color: #fff;
            min-height: 60vh;
        }

        .topo-favoritos {
            margin-bottom: 28px;
        }

        .topo-favoritos a {
            color: #8fc5ff;
            text-decoration: none;
        }

        .topo-favoritos h1 {
            margin-bottom: 8px;
        }

        .grade-favoritos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 22px;
        }

        .card-favorito {
            overflow: hidden;
            border: 1px solid #263e70;
            border-radius: 12px;
            background: #101a35;
        }

        .card-favorito img {
            display: block;
            width: 100%;
            height: 210px;
            object-fit: cover;
        }

        .conteudo-favorito {
            padding: 16px;
        }

        .conteudo-favorito h2 {
            font-size: 19px;
            margin: 8px 0;
        }

        .preco-favorito {
            color: #60a5fa;
            font-weight: bold;
        }

        .card-favorito button {
            width: 100%;
            padding: 11px;
            margin-top: 10px;
            border-radius: 7px;
            cursor: pointer;
        }

        .btn-detalhes-favorito {
            background: #1689f8;
            border: none;
            color: white;
        }

        .btn-remover-favorito {
            background: transparent;
            border: 1px solid #1689f8;
            color: #8fc5ff;
        }

        .estado-favoritos {
            padding: 24px;
            border: 1px solid #263e70;
            border-radius: 12px;
            background: #101a35;
        }
    </style>
</head>

<body>
    <main class="pagina-favoritos">
        <div class="topo-favoritos">
            <a href="index.html">← Voltar para a loja</a>
            <h1>♥ Meus favoritos</h1>
            <p>Seus jogos favoritos ficam reunidos aqui.</p>
        </div>

        <div id="mensagemFavoritos" class="estado-favoritos">
            Carregando seus favoritos...
        </div>

        <div id="listaFavoritos" class="grade-favoritos"></div>
    </main>

    <script src="javascript/favoritos.js"></script>
</body>
</html>
