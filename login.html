
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GameVerse</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .login-container {
            max-width: 420px;
            margin: 60px auto;
            padding: 30px;
            border-radius: 15px;
            background: #1e1e2f;
            color: white;
            box-sizing: border-box;
        }

        .login-container h1 {
            text-align: center;
            color: #ff4fa3;
            margin-bottom: 10px;
        }

        .login-container p {
            text-align: center;
            color: #ccc;
        }

        .login-container label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
        }

        .login-container input {
            width: 100%;
            padding: 12px;
            border-radius: 7px;
            border: 1px solid #555;
            box-sizing: border-box;
        }

        .login-container button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #ff4fa3;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .login-container button:hover {
            background: #e7358b;
        }

        #mensagem {
            margin-top: 15px;
            text-align: center;
        }

        .links-login {
            text-align: center;
            margin-top: 20px;
        }

        .links-login a {
            color: #ff75b8;
        }
    </style>
</head>

<body>
    <main class="login-container">
        <h1>GameVerse</h1>
        <p>Entre na sua conta para continuar</p>

        <form id="formLogin">
            <label for="usuario">Usuário</label>
            <input
                type="text"
                id="usuario"
                name="usuario"
                required
                autocomplete="username"
                placeholder="Digite seu usuário"
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                name="senha"
                required
                autocomplete="current-password"
                placeholder="Digite sua senha"
            >

            <button type="submit">Entrar</button>
        </form>

        <div id="mensagem" role="status"></div>

        <div class="links-login">
            <p>Não tem uma conta?</p>
            <a href="cadastro.html">Criar minha conta</a>
            <br><br>
            <a href="index.html">Voltar para a loja</a>
        </div>
    </main>

    <script>
        const formLogin = document.getElementById("formLogin");
        const mensagem = document.getElementById("mensagem");

        formLogin.addEventListener("submit", async function(evento) {
            evento.preventDefault();

            const usuario = document.getElementById("usuario").value.trim();
            const senha = document.getElementById("senha").value;

            mensagem.textContent = "Verificando login...";

            try {
                const resposta = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({ usuario, senha })
                });

                const dados = await resposta.json();

                if (!resposta.ok) {
                    mensagem.textContent = dados.erro || "Não foi possível entrar.";
                    return;
                }

                const voltarPara = sessionStorage.getItem(
    "gameverseVoltarAposLogin"
);

if (
    voltarPara === "/meus-jogos.html" ||
    voltarPara === "/minha-conta.html" ||
    /^\/detalhes\.html\?id=\d+$/.test(voltarPara || "")
) {
    sessionStorage.removeItem("gameverseVoltarAposLogin");
    window.location.href = voltarPara;
} else {
    window.location.href = dados.destino;
}
            } catch (erro) {
                mensagem.textContent = "Erro de conexão com o servidor.";
            }
        });
    </script>
</body>
</html>
